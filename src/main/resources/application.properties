spring.application.name=CollegeBlog
# Server Port
server.port=8080

# MySQL Database Connection (Automatically creates database if missing)
spring.datasource.url=jdbc:mysql://localhost:3306/college_blog_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root

# JPA & Hibernate Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# File Upload Limits (For Notes & Assignments up to 20MB)
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB
