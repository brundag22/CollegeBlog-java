<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Teacher Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <!-- Navigation Bar -->
    <nav class="navbar navbar-dark bg-dark">
        <div class="container-fluid">
            <span class="navbar-brand mb-0 h1">College Blog - Teacher Portal</span>
            <a href="/logout" class="btn btn-outline-light btn-sm">Logout</a>
        </div>
    </nav>

    <div class="container mt-5">
        <h2 th:text="'Welcome, ' + ${teacher.username} + '!'">Welcome, Teacher!</h2>
        <hr>
        
        <div class="row mt-4">
            <!-- Notes Section Card -->
            <div class="col-md-6">
                <div class="card shadow">
                    <div class="card-body text-center">
                        <h4>Study Materials</h4>
                        <p class="text-muted">Upload and manage class notes and PDFs.</p>
                        <a href="/teacher/notes" class="btn btn-primary">Manage Notes</a>
                    </div>
                </div>
            </div>
            
            <!-- Assignments Section Card -->
            <div class="col-md-6">
                <div class="card shadow mt-3 mt-md-0">
                    <div class="card-body text-center">
                        <h4>Assignments</h4>
                        <p class="text-muted">Post assignments and view submissions.</p>
                        <a href="/teacher/assignments" class="btn btn-success">Manage Assignments</a>
                    </div>
                </div>
            </div>
        </div>
    </div>

</body>
</html>
