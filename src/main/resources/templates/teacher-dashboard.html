<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><title>Teacher Dashboard</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"></head>
<body class="bg-light">
    <nav class="navbar navbar-dark bg-dark"><div class="container-fluid"><span class="navbar-brand">Teacher Portal</span><a href="/logout" class="btn btn-outline-light btn-sm">Logout</a></div></nav>
    <div class="container mt-5">
        <h2 th:text="'Welcome, ' + ${teacher.username} + '!'"></h2><hr>
        <div class="row mt-4">
            <div class="col-md-3"><div class="card shadow p-4 text-center"><h5>Notes</h5><a href="/teacher/notes" class="btn btn-primary mt-2">Manage</a></div></div>
            <div class="col-md-3"><div class="card shadow p-4 text-center"><h5>Assignments</h5><a href="/teacher/assignments" class="btn btn-success mt-2">Manage</a></div></div>
            <div class="col-md-3"><div class="card shadow p-4 text-center"><h5>Quizzes</h5><a href="/teacher/quizzes" class="btn btn-warning mt-2">Manage</a></div></div>
            <div class="col-md-3"><div class="card shadow p-4 text-center"><h5>Attendance</h5><a href="/teacher/attendance" class="btn btn-danger mt-2">Manage</a></div></div>
        </div>
    </div>
</body>
</html>
