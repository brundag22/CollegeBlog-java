<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Student Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<nav class="navbar navbar-dark bg-dark">
    <div class="container-fluid">
        <span class="navbar-brand">Student Portal</span>
        <a href="/logout" class="btn btn-outline-light btn-sm">Logout</a>
    </div>
</nav>
<div class="container mt-5">
    <h2 th:text="'Welcome, ' + ${student.username} + '!'">Welcome!</h2>
    <hr>
    <div class="row g-4 mt-3">
        <div class="col-md-6">
            <div class="card shadow p-4 text-center">
                <h5>Quizzes</h5>
                <a href="/student/quizzes" class="btn btn-warning mt-2">Take quizzes</a>
            </div>
        </div>
        <div class="col-md-6">
            <div class="card shadow p-4 text-center">
                <h5>Attendance</h5>
                <a href="/student/attendance" class="btn btn-primary mt-2">View attendance</a>
            </div>
        </div>
    </div>
</div>
</body>
</html>
