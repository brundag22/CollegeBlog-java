<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><title>Manage Attendance</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"></head>
<body class="bg-light">
    <nav class="navbar navbar-dark bg-dark"><div class="container-fluid"><span class="navbar-brand">Attendance</span><a href="/teacher/dashboard" class="btn btn-outline-light btn-sm">Back</a></div></nav>
    <div class="container mt-4">
        <div class="card shadow mb-4"><div class="card-body">
            <h5>Mark Attendance (Today)</h5>
            <form action="/teacher/attendance/mark" method="post" class="d-flex gap-3">
                <select name="studentId" class="form-control" required>
                    <option value="">Select Student</option>
                    <option th:each="s : ${students}" th:value="${s.id}" th:text="${s.username}"></option>
                </select>
                <select name="status" class="form-control" required>
                    <option value="Present">Present</option>
                    <option value="Absent">Absent</option>
                </select>
                <button type="submit" class="btn btn-primary">Save</button>
            </form>
        </div></div>
        <h5>History</h5>
        <table class="table table-bordered bg-white">
            <thead class="table-dark"><tr><th>Date</th><th>Student</th><th>Status</th></tr></thead>
            <tbody>
                <tr th:each="r : ${records}">
                    <td th:text="${r.date}"></td>
                    <td th:text="${r.student.username}"></td>
                    <td th:text="${r.status}"></td>
                </tr>
            </tbody>
        </table>
    </div>
</body>
</html>
