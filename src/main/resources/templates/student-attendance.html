<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><title>My Attendance</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"></head>
<body class="bg-light">
    <nav class="navbar navbar-dark bg-dark"><div class="container-fluid"><span class="navbar-brand">My Attendance</span><a href="/student/dashboard" class="btn btn-outline-light btn-sm">Back</a></div></nav>
    <div class="container mt-4">
        <table class="table table-bordered bg-white shadow-sm">
            <thead class="table-dark"><tr><th>Date</th><th>Status</th></tr></thead>
            <tbody>
                <tr th:each="r : ${records}">
                    <td th:text="${r.date}"></td>
                    <td th:text="${r.status}"></td>
                </tr>
            </tbody>
        </table>
    </div>
</body>
</html>
