<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Manage Notes</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <!-- Navigation Bar -->
    <nav class="navbar navbar-dark bg-dark">
        <div class="container-fluid">
            <span class="navbar-brand mb-0 h1">College Blog - Manage Notes</span>
            <div>
                <a href="/teacher/dashboard" class="btn btn-outline-light btn-sm me-2">Back to Dashboard</a>
                <a href="/logout" class="btn btn-outline-danger btn-sm">Logout</a>
            </div>
        </div>
    </nav>

    <div class="container mt-5">
        
        <!-- File Upload Form -->
        <div class="card shadow mb-5">
            <div class="card-header bg-primary text-white">
                <h5 class="mb-0">Upload New Study Material</h5>
            </div>
            <div class="card-body">
                <!-- enctype="multipart/form-data" is strictly required for file uploads -->
                <form action="/teacher/notes/upload" method="post" enctype="multipart/form-data">
                    <div class="row">
                        <div class="col-md-5 mb-3">
                            <label class="form-label">Note Title (e.g. Chapter 1 - Data Structures)</label>
                            <input type="text" name="title" class="form-control" required>
                        </div>
                        <div class="col-md-5 mb-3">
                            <label class="form-label">Select File (PDF, DOCX, etc.)</label>
                            <input type="file" name="file" class="form-control" required>
                        </div>
                        <div class="col-md-2 mb-3 d-flex align-items-end">
                            <button type="submit" class="btn btn-primary w-100">Upload</button>
                        </div>
                    </div>
                </form>
            </div>
        </div>

        <!-- Table of Uploaded Notes -->
        <h3>Uploaded Notes</h3>
        <table class="table table-bordered table-striped bg-white shadow-sm mt-3">
            <thead class="table-dark">
                <tr>
                    <th>Title</th>
                    <th>File Name</th>
                    <th>Upload Date</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="note : ${notes}">
                    <td th:text="${note.title}"></td>
                    <td th:text="${note.fileName}"></td>
                    <td th:text="${#temporals.format(note.uploadDate, 'dd-MM-yyyy HH:mm')}"></td>
                </tr>
            </tbody>
        </table>

    </div>

</body>
</html>
