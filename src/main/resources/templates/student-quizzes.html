<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><title>Quizzes</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"></head>
<body class="bg-light">
    <nav class="navbar navbar-dark bg-dark"><div class="container-fluid"><span class="navbar-brand">Quizzes</span><a href="/student/dashboard" class="btn btn-outline-light btn-sm">Back</a></div></nav>
    <div class="container mt-4">
        <div class="row">
            <div class="col-md-6" th:each="quiz : ${quizzes}">
                <div class="card shadow mb-3"><div class="card-body">
                    <h5 th:text="${quiz.title}"></h5>
                    <p class="fw-bold" th:text="${quiz.question}"></p>
                    <form action="/student/quizzes/submit" method="post">
                        <input type="hidden" name="quizId" th:value="${quiz.id}">
                        <div class="form-check"><input class="form-check-input" type="radio" name="answer" value="A" required> <label class="form-check-label" th:text="${quiz.optionA}"></label></div>
                        <div class="form-check"><input class="form-check-input" type="radio" name="answer" value="B"> <label class="form-check-label" th:text="${quiz.optionB}"></label></div>
                        <div class="form-check"><input class="form-check-input" type="radio" name="answer" value="C"> <label class="form-check-label" th:text="${quiz.optionC}"></label></div>
                        <div class="form-check mb-3"><input class="form-check-input" type="radio" name="answer" value="D"> <label class="form-check-label" th:text="${quiz.optionD}"></label></div>
                        <button type="submit" class="btn btn-warning w-100">Submit Answer</button>
                    </form>
                </div></div>
            </div>
        </div>
        
        <h5 class="mt-4">My Results</h5>
        <table class="table table-bordered bg-white">
            <thead class="table-dark"><tr><th>Quiz</th><th>Score</th></tr></thead>
            <tbody>
                <tr th:each="r : ${results}">
                    <td th:text="${r.quiz.title}"></td>
                    <td th:text="${r.score} + '%'"></td>
                </tr>
            </tbody>
        </table>
    </div>
</body>
</html>
